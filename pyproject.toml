[project]
name = "security-hawk"
version = "0.3.4"
description = "Home Assistant app — floor plan viewer with live sensor and camera state"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "channels>=4.0,<5.0",
    "daphne>=4.0,<5.0",
    "websockets>=12.0,<14.0",
    "aiohttp>=3.9,<4.0",
    "defusedxml>=0.7",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF012", # mutable class attributes (Django models use these)
]

[tool.ruff.lint.per-file-ignores]
"backend/securityhawk/asgi.py" = ["E402"]
"tests/*" = ["TCH"]

[tool.ruff.lint.isort]
known-first-party = ["securityhawk", "plans", "ha", "live", "kiosk"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "securityhawk.settings"
pythonpath = ["backend"]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "{arch}", "*.egg", "scripts"]
asyncio_mode = "auto"
addopts = "--cov=backend --cov-report=term-missing"

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/securityhawk/asgi.py",
    "backend/manage.py",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
